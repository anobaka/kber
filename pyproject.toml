[project]
name = "kber"
version = "0.1.0"
description = "Enterprise Knowledge Base Management System – manage code knowledge bases through chat and workspaces"
requires-python = ">=3.11"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "lark-oapi>=1.3.0",
    "SQLAlchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=41.0",
    "pymilvus>=2.4",
    "openai>=1.0",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-java>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
    "tree-sitter-c>=0.23",
    "tree-sitter-cpp>=0.23",
    "GitPython>=3.1",
    "pathspec>=0.12",
    "APScheduler>=3.10,<4.0",
    "redis>=5.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"
